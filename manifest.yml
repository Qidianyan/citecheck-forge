# CiteCheck — Rovo Agent that verifies legal citations in AI-generated text.
# app.id is a placeholder until `forge register` is run with the team's Atlassian developer account.
app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x
    memoryMB: 512
    architecture: arm64

  storage:
    entities:
      - name: audit
        attributes:
          product:
            type: string
          id:
            type: string
          verifiedAt:
            type: string
          flagged:
            type: integer
        indexes:
          - name: by-time
            range:
              - verifiedAt
      - name: orgsource
        attributes:
          sourceKey:
            type: string
        indexes:
          - name: by-source-key
            range:
              - sourceKey
modules:
  rovo:agent:
    - key: citecheck-agent
      name: CiteCheck Legal Citations
      description: >-
        Verifies legal and corporate-policy citations in Confluence, Jira or AI drafts against official
        statutes (EU GDPR, EU AI Act, US FRCP, VN, ID, TH) and Confluence policies: flags missing articles,
        repealed rules and misattributions.
      icon: resource:agent-assets;icon.svg
      prompt: resource:agent-assets;prompt.txt
      conversationStarters:
        - Check the legal and policy citations on this page
        - Verify GDPR Article 33 and EU AI Act Article 5 in this draft
        - List our registered Confluence policies
        - Which statutes and jurisdictions can you verify against?
      followUpPrompt: >-
        Suggest one or two next steps, such as posting the verification report as a comment,
        labelling the content for legal review, or opening the official source of a flagged citation.
      actions:
        - extract-citations
        - verify-citation
        - verify-content
        - list-sources
        - list-registered-org-policies
        - post-confluence-report
        - post-jira-report
        - share-report
        - export-report
      skills:
        - citation-audit

  rovo:skill:
    - key: citation-audit
      source:
        dir: skills/citation-audit
      dependencies:
        tools:
          - verify-content
          - verify-citation
          - list-registered-org-policies
          - post-confluence-report
          - post-jira-report

  rovo:mcp:
    - key: citecheck-mcp
      name: CiteCheck Citation Tools
      tools:
        - verify-citation
        - verify-content
        - list-sources
        - list-registered-org-policies

  action:
    - key: extract-citations
      name: Extract legal citations
      function: extract-citations-fn
      actionVerb: GET
      description: >-
        Extract the legal citations (statute articles, law numbers, case numbers and quoted text) from the
        current Confluence page or Jira work item, or from text supplied by the user. Does not verify them.
      inputs:
        text:
          title: Text
          type: string
          required: false
          description: Text to scan. Leave empty to use the Confluence page or Jira work item in context.
        contentId:
          title: Confluence page ID
          type: string
          required: false
          description: ID of a Confluence page to scan when it is not the page in context.
        issueKey:
          title: Jira work item key
          type: string
          required: false
          description: Key of a Jira work item (e.g. LEGAL-12) to scan when it is not the item in context.
    - key: verify-citation
      name: Verify one legal citation
      function: verify-citation-fn
      actionVerb: GET
      description: >-
        Verify one citation (e.g. "Pasal 13 UU 27/2022", "Điều 9 Luật 91/2025/QH15") and optional quote:
        law and article exist, in force on a date, quote match, hallucination type, official source.
      inputs:
        citation:
          title: Citation
          type: string
          required: true
          description: The citation as written, including the law name or number and the article.
        quote:
          title: Quoted text
          type: string
          required: false
          description: Text the citation claims the article says, if any.
        asOf:
          title: As-of date
          type: string
          required: false
          description: Date (YYYY-MM-DD) to check whether the law is in force. Defaults to today.
    - key: verify-content
      name: Verify all citations in content
      function: verify-content-fn
      actionVerb: GET
      description: >-
        Verify every legal citation in the current Confluence page or Jira work item (or supplied text).
        Returns a verdict per citation with hallucination type, reason and official source, plus a summary.
      inputs:
        text:
          title: Text
          type: string
          required: false
          description: Text to verify. Leave empty to use the Confluence page or Jira work item in context.
        contentId:
          title: Confluence page ID
          type: string
          required: false
          description: ID of a Confluence page to verify when it is not the page in context.
        issueKey:
          title: Jira work item key
          type: string
          required: false
          description: Key of a Jira work item to verify when it is not the item in context.
        asOf:
          title: As-of date
          type: string
          required: false
          description: Date (YYYY-MM-DD) for the in-force check. Defaults to today.
    - key: list-sources
      name: List verifiable laws
      function: list-sources-fn
      actionVerb: GET
      description: >-
        List the official statutes CiteCheck can verify against (jurisdiction, number, title, in-force status,
        article count, official source URL and fetch date).
      inputs:
        country:
          title: Jurisdiction
          type: string
          required: false
          description: Optional filter, one of EU, US, VN, ID, TH.
    - key: list-registered-org-policies
      name: List registered organisation policies
      function: list-org-policies-fn
      actionVerb: GET
      description: >-
        List and search the company's authoritative Confluence policy pages registered in CiteCheck (source key,
        title, active vs archived status, clause count, Confluence URL and matching clauses).
      inputs:
        query:
          title: Search query
          type: string
          required: false
          description: Optional keyword to search by policy key, title or clause wording.
        status:
          title: Lifecycle status
          type: string
          required: false
          description: Optional filter — "all" (default), "active" or "archived".
    - key: post-confluence-report
      name: Post citation report to Confluence page
      function: post-conf-report-fn
      actionVerb: CREATE
      description: >-
        Verify the citations on a Confluence page and post the verification report as a footer comment,
        and add the label citecheck-flagged or citecheck-verified. Only call after the user confirms.
      inputs:
        contentId:
          title: Confluence page ID
          type: string
          required: false
          description: ID of the page. Leave empty to use the page in context.
    - key: post-jira-report
      name: Post citation report to Jira work item
      function: post-jira-report-fn
      actionVerb: CREATE
      description: >-
        Verify the citations in a Jira work item and post the verification report as a comment, and add the
        label citecheck-flagged or citecheck-verified. Only call after the user confirms.
      inputs:
        issueKey:
          title: Jira work item key
          type: string
          required: false
          description: Key of the work item. Leave empty to use the work item in context.

    - key: share-report
      name: Share citation report
      function: share-report-fn
      actionVerb: CREATE
      description: >-
        Share a stored citation report: mode "page" publishes a child page (Confluence), mode "forward"
        mentions a teammate in a comment and can assign the Jira work item. Only call after the user confirms.
      inputs:
        mode:
          title: Mode
          type: string
          required: true
          description: '"page" to publish a report page, "forward" to mention a teammate.'
        contentId:
          title: Confluence page ID
          type: string
          required: false
          description: ID of the page. Leave empty to use the page in context.
        issueKey:
          title: Jira work item key
          type: string
          required: false
          description: Key of the work item. Leave empty to use the work item in context.
        accountId:
          title: Teammate account ID
          type: string
          required: false
          description: Atlassian account ID of the teammate to mention (forward mode).
        note:
          title: Note
          type: string
          required: false
          description: Optional plain-text note for the teammate, at most 500 characters. Not stored.
        assign:
          title: Also assign
          type: boolean
          required: false
          description: Jira only. Also assign the work item to the teammate.
    - key: export-report
      name: Export citation report
      function: export-report-fn
      actionVerb: GET
      description: >-
        Return the stored citation report of a Confluence page or Jira work item as Markdown with a file name
        and a link to the item, so the user can paste it into e-mail, chat or a ticket. Does not change content.
      inputs:
        contentId:
          title: Confluence page ID
          type: string
          required: false
          description: ID of the page. Leave empty to use the page in context.
        issueKey:
          title: Jira work item key
          type: string
          required: false
          description: Key of the work item. Leave empty to use the work item in context.

  confluence:contentBylineItem:
    - key: citecheck-byline
      title: Citations
      resource: ui
      render: native
      resolver:
        function: ui-resolver-fn

  jira:issuePanel:
    - key: citecheck-issue-panel
      title: Legal citation check
      icon: resource:agent-assets;icon.svg
      resource: ui
      render: native
      resolver:
        function: ui-resolver-fn

  confluence:globalSettings:
    - key: citecheck-admin
      title: CiteCheck admin
      resource: ui-admin
      render: native
      resolver:
        function: admin-resolver-fn

  trigger:
    - key: conf-updated-trigger
      function: conf-updated-fn
      events:
        - avi:confluence:updated:page
    - key: jira-updated-trigger
      function: jira-updated-fn
      events:
        - avi:jira:updated:issue
  consumer:
    - key: recheck-consumer
      queue: citecheck-recheck
      function: recheck-fn
  function:
    - key: conf-updated-fn
      handler: index.onConfluenceUpdated
    - key: jira-updated-fn
      handler: index.onJiraUpdated
    - key: recheck-fn
      handler: index.recheckConsumer
    - key: extract-citations-fn
      handler: index.extractCitations
    - key: verify-citation-fn
      handler: index.verifyCitation
    - key: verify-content-fn
      handler: index.verifyContent
    - key: list-sources-fn
      handler: index.listSources
    - key: list-org-policies-fn
      handler: index.listRegisteredOrgPolicies
    - key: post-conf-report-fn
      handler: index.postConfluenceReport
    - key: post-jira-report-fn
      handler: index.postJiraReport
    - key: share-report-fn
      handler: index.shareReport
    - key: export-report-fn
      handler: index.exportReport
    - key: ui-resolver-fn
      handler: index.uiResolver
    - key: admin-resolver-fn
      handler: index.adminResolver

resources:
  - key: ui
    path: src/frontend/index.jsx
  - key: ui-admin
    path: src/frontend/admin.jsx
  - key: agent-assets
    path: prompts

permissions:
  scopes:
    - storage:app
    - read:page:confluence
    - read:confluence-content.all
    - write:confluence-content
    - write:comment:confluence
    - write:page:confluence
    - read:jira-work
    - write:jira-work
    - read:label:confluence
    - read:confluence-content.summary
