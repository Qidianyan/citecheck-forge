server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
  # Optional advisory API (web demo only). It runs in a separate container on a private docker network and is OFF by default.
  resolver 127.0.0.11 valid=30s ipv6=off;
  location /api/ {
    set $api http://citecheck-api:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    client_max_body_size 8k;
    proxy_read_timeout 25s;
    proxy_intercept_errors off;
    error_page 502 503 504 = @api_down;
  }
  location @api_down { default_type application/json; return 503 '{"advisory":true,"enabled":false,"error":"DISABLED","label":"Advisory only","message":"The advisory re-check is switched off on this server."}'; }
  location = /mock { return 404; }
  location ^~ /mock/ { return 404; }
  location / { try_files $uri $uri/ =404; }
  location ~ /\. { deny all; }
}
